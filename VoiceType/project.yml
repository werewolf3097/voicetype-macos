name: VoiceType
options:
  bundleIdPrefix: com.farrukh
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
targets:
  VoiceType:
    type: application
    platform: macOS
    sources:
      - path: VoiceType/Sources
      - path: VoiceType/Resources/Fonts
        type: folder
        buildPhase: resources
    info:
      path: VoiceType/Resources/Info.plist
      properties:
        ATSApplicationFontsPath: "Fonts"
        NSMicrophoneUsageDescription: "VoiceType записывает голос, чтобы превратить его в текст."
        NSAudioCaptureUsageDescription: "VoiceType записывает системный звук во время встреч, чтобы распознавать речь собеседников."
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        LSUIElement: false
        CFBundleShortVersionString: "0.2.0"
        CFBundleVersion: "2"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.farrukh.voicetype
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: false
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  VoiceTypeTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: VoiceTypeTests
      - path: VoiceType/Sources/AudioCompressor.swift
      - path: VoiceType/Sources/TranscriptionProvider.swift
      - path: VoiceType/Sources/WhisperWindowsClient.swift
      - path: VoiceType/Sources/CloudAudioSTTProviders.swift
      - path: VoiceType/Sources/HomeServerProvider.swift
      - path: VoiceType/Sources/HistoryStore.swift
      - path: VoiceType/Sources/GapiClient.swift
      - path: VoiceType/Sources/RussianTransliterator.swift
      - path: VoiceType/Sources/TranscriptionProgress.swift
      - path: VoiceType/Sources/PaperTheme.swift
      - path: VoiceType/Sources/PaperTextureGenerator.swift
      - path: VoiceType/Sources/HotkeyStateMachine.swift
      - path: VoiceType/Sources/DictionaryStore.swift
      - path: VoiceType/Sources/TextInjector.swift
      - path: VoiceType/Sources/SettingsStore.swift
      - path: VoiceType/Sources/KeychainStore.swift
      - path: VoiceType/Sources/DockIconController.swift
      - path: VoiceType/Sources/UzbekDialectConverter.swift
      - path: VoiceType/Sources/PermissionsHelper.swift
      - path: VoiceType/Sources/AudioRecorder.swift
      - path: VoiceType/Sources/AudioInputDeviceManager.swift
      - path: VoiceType/Sources/SoundCuePlayer.swift
      - path: VoiceType/Sources/LLMPostProcessor.swift
      - path: VoiceType/Sources/ClaudeClient.swift
      - path: VoiceType/Sources/MeetingsStore.swift
      - path: VoiceType/Sources/MeetingRecapGenerator.swift
      - path: VoiceType/Sources/PaperComponents.swift
      - path: VoiceType/Sources/RecordingIndicatorView.swift
      - path: VoiceType/Sources/RecordingIndicatorController.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.farrukh.voicetype.tests
        SWIFT_VERSION: "5.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
schemes:
  VoiceType:
    build:
      targets:
        VoiceType: all
        VoiceTypeTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - VoiceTypeTests
